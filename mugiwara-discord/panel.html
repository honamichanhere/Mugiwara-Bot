<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mugiwara Bot Panel</title>
<style>
:root { --bg:#1f1108; --card:#2a1a0e; --line:#4a3220; --text:#f5e9dd; --muted:#b9a592; --accent:#ff9132; --ok:#62d08a; --err:#ff5f56; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,Segoe UI,sans-serif; }
header { padding:16px 24px; border-bottom:1px solid var(--line); font-weight:600; font-size:16px; }
header span { color:var(--accent); }
main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; padding:24px; max-width:1200px; margin:0 auto; }
@media (max-width:860px) { main { grid-template-columns:1fr; } }
section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
h2 { margin:0 0 12px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
label { display:block; margin:12px 0 4px; color:var(--muted); font-size:12px; }
input, textarea, select { width:100%; background:#170c05; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
textarea { min-height:110px; resize:vertical; }
input[type=color] { padding:2px; height:36px; }
input[type=checkbox] { width:auto; margin-right:6px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.check { display:flex; align-items:center; margin:12px 0 0; color:var(--text); font-size:13px; }
button { background:var(--accent); color:#1f1108; border:0; border-radius:6px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
button.small { padding:4px 10px; font-size:12px; }
.bar { display:flex; gap:8px; align-items:center; margin-top:16px; flex-wrap:wrap; }
.field { border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:8px; }
.field .row { gap:8px; }
#status { font-size:13px; }
#status.ok { color:var(--ok); } #status.err { color:var(--err); }
.preview { background:#313338; border-radius:8px; padding:14px; color:#dbdee1; }
.preview .msg { white-space:pre-wrap; margin-bottom:8px; }
.embed { border-left:4px solid var(--accent); background:#2b2d31; border-radius:4px; padding:10px 14px; max-width:520px; position:relative; }
.embed .title { font-weight:700; color:#fff; margin-bottom:4px; }
.embed .desc { white-space:pre-wrap; }
.embed .fields { display:grid; gap:8px; margin-top:8px; }
.embed .fname { font-weight:700; color:#fff; }
.embed img.big { max-width:100%; border-radius:4px; margin-top:10px; display:block; }
.embed img.thumb { position:absolute; right:12px; top:12px; width:64px; height:64px; border-radius:4px; object-fit:cover; }
.embed .footer { color:#949ba4; font-size:12px; margin-top:10px; }
.hint { color:var(--muted); font-size:12px; margin-top:6px; }
code { background:#170c05; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header><span>Mugiwara</span> Bot Panel</header>
<main>
  <section>
    <h2>Compose</h2>

    <label for="channel">Channel</label>
    <div class="row" style="grid-template-columns:1fr auto">
      <select id="channel"></select>
      <button class="ghost small" id="copyMention" type="button">Copy mention</button>
    </div>

    <label for="content">Message text (optional, above the embed)</label>
    <textarea id="content" style="min-height:60px"></textarea>

    <label class="check"><input type="checkbox" id="useEmbed" checked> Include an embed</label>

    <div id="embedForm">
      <label for="title">Title</label>
      <input id="title" maxlength="256">
      <label for="desc">Description (supports **bold**, *italic*, `code`, and &lt;#channelId&gt; mentions)</label>
      <textarea id="desc" maxlength="4096"></textarea>
      <div class="row">
        <div><label for="color">Color</label><input type="color" id="color" value="#ff9132"></div>
        <div><label for="footer">Footer</label><input id="footer" maxlength="2048" value="Mugiwara HUB"></div>
      </div>
      <div class="row">
        <div><label for="image">Image URL</label><input id="image" placeholder="https://..."></div>
        <div><label for="thumb">Thumbnail URL</label><input id="thumb" placeholder="https://..."></div>
      </div>
      <label>Fields</label>
      <div id="fields"></div>
      <div class="bar"><button class="ghost small" id="addField" type="button">+ Add field</button></div>
    </div>

    <label class="check"><input type="checkbox" id="pings"> Allow @everyone / @here / role pings</label>

    <div class="bar">
      <button id="send" type="button">Send</button>
      <button class="ghost" id="clear" type="button">Clear</button>
      <span id="status"></span>
    </div>
  </section>

  <section>
    <h2>Preview</h2>
    <div class="preview">
      <div class="msg" id="pvMsg"></div>
      <div class="embed" id="pvEmbed">
        <img class="thumb" id="pvThumb" alt="">
        <div class="title" id="pvTitle"></div>
        <div class="desc" id="pvDesc"></div>
        <div class="fields" id="pvFields"></div>
        <img class="big" id="pvImage" alt="">
        <div class="footer" id="pvFooter"></div>
      </div>
    </div>
    <div class="hint">The preview is approximate. Discord renders the final message.</div>
  </section>
</main>

<script>
const SESSION = "__SESSION__";
const $ = id => document.getElementById(id);
const headers = { "Content-Type": "application/json", "x-session": SESSION };
let channels = [];

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function md(s) {
  let out = esc(s);
  out = out.replace(/\*\*(.+?)\*\*/gs, "<b>$1</b>").replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/gs, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/&lt;#(\d+)&gt;/g, (m, id) => { const c = channels.find(x => x.id === id); return `<span style="color:#c9cdfb">#${esc(c ? c.name : id)}</span>`; });
  return out;
}

function fieldRow(f = {}) {
  const div = document.createElement("div");
  div.className = "field";
  div.innerHTML = `<div class="row"><input class="fn" placeholder="Name" maxlength="256" value="${esc(f.name || "")}"><input class="fv" placeholder="Value" maxlength="1024" value="${esc(f.value || "")}"></div>
    <div class="bar" style="margin-top:6px"><label class="check" style="margin:0"><input type="checkbox" class="fi"> Inline</label><button class="ghost small rm" type="button">Remove</button></div>`;
  div.querySelector(".rm").onclick = () => { div.remove(); render(); };
  div.addEventListener("input", render);
  $("fields").appendChild(div);
}

function buildEmbed() {
  if (!$("useEmbed").checked) return null;
  const e = {};
  if ($("title").value.trim()) e.title = $("title").value.trim();
  if ($("desc").value.trim()) e.description = $("desc").value;
  e.color = parseInt($("color").value.slice(1), 16);
  if ($("footer").value.trim()) e.footer = { text: $("footer").value.trim() };
  if ($("image").value.trim()) e.image = { url: $("image").value.trim() };
  if ($("thumb").value.trim()) e.thumbnail = { url: $("thumb").value.trim() };
  const fields = [...document.querySelectorAll("#fields .field")].map(el => ({
    name: el.querySelector(".fn").value.trim(), value: el.querySelector(".fv").value.trim(), inline: el.querySelector(".fi").checked,
  })).filter(f => f.name && f.value);
  if (fields.length) e.fields = fields;
  return (e.title || e.description || e.fields || e.image) ? e : null;
}

function render() {
  const msg = $("content").value;
  $("pvMsg").innerHTML = md(msg);
  $("pvMsg").style.display = msg ? "block" : "none";
  $("embedForm").style.display = $("useEmbed").checked ? "block" : "none";
  const e = buildEmbed();
  $("pvEmbed").style.display = e ? "block" : "none";
  if (!e) return;
  $("pvEmbed").style.borderLeftColor = "#" + e.color.toString(16).padStart(6, "0");
  $("pvTitle").innerHTML = md(e.title || "");
  $("pvDesc").innerHTML = md(e.description || "");
  $("pvFooter").textContent = e.footer ? e.footer.text : "";
  $("pvImage").style.display = e.image ? "block" : "none"; if (e.image) $("pvImage").src = e.image.url;
  $("pvThumb").style.display = e.thumbnail ? "block" : "none"; if (e.thumbnail) $("pvThumb").src = e.thumbnail.url;
  $("pvFields").innerHTML = (e.fields || []).map(f => `<div><div class="fname">${esc(f.name)}</div><div>${md(f.value)}</div></div>`).join("");
}

function setStatus(text, cls) { $("status").textContent = text; $("status").className = cls || ""; }

async function loadChannels() {
  try {
    const r = await fetch("/api/channels", { headers });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    channels = data;
    const sel = $("channel");
    sel.innerHTML = "";
    let group = null, og = null;
    for (const c of channels) {
      if (c.category !== group) { group = c.category; og = document.createElement("optgroup"); og.label = group || "(no category)"; sel.appendChild(og); }
      const o = document.createElement("option"); o.value = c.id; o.textContent = "# " + c.name; og.appendChild(o);
    }
    render();
  } catch (err) { setStatus("Could not load channels: " + err.message, "err"); }
}

$("send").onclick = async () => {
  const embed = buildEmbed();
  const content = $("content").value.trim();
  if (!content && !embed) return setStatus("Nothing to send.", "err");
  const name = channels.find(c => c.id === $("channel").value)?.name;
  if (!confirm(`Send this message to #${name}?`)) return;
  $("send").disabled = true; setStatus("Sending...");
  try {
    const r = await fetch("/api/send", { method: "POST", headers, body: JSON.stringify({
      channelId: $("channel").value, content, embeds: embed ? [embed] : [], allowPings: $("pings").checked,
    })});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    setStatus("Sent.", "ok");
  } catch (err) { setStatus("Failed: " + err.message, "err"); }
  $("send").disabled = false;
};

$("copyMention").onclick = async () => {
  const id = $("channel").value;
  try { await navigator.clipboard.writeText(`<#${id}>`); setStatus("Copied <#" + id + ">", "ok"); } catch { setStatus(`<#${id}>`); }
};
$("addField").onclick = () => { fieldRow(); render(); };
$("clear").onclick = () => { $("content").value = ""; $("title").value = ""; $("desc").value = ""; $("image").value = ""; $("thumb").value = ""; $("fields").innerHTML = ""; setStatus(""); render(); };
document.querySelectorAll("input, textarea, select").forEach(el => el.addEventListener("input", render));
loadChannels();
</script>
</body>
</html>
